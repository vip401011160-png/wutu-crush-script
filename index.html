  .topbar { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }

  .opts { display: flex; flex-direction: column; gap: 10px; }

  .site-footer { position: fixed; left: 0; right: 0; bottom: 0; padding: 10px 14px calc(10px + env(safe-area-inset-bottom)); background: rgba(8,5,10,.9); border-top: 1px solid rgba(212,175,55,.15); backdrop-filter: blur(12px); text-align: center; font-size: 11px; line-height: 1.45; color: #8f8490; z-index: 20; }

const state = { unlocked: false, answers: [], qIndex: 0 };
function show(id) {
  document.querySelectorAll(".screen").forEach(el => el.classList.remove("active"));
  document.getElementById(id).classList.add("active");
  window.scrollTo({ top: 0, behavior: "smooth" });
}
const accessInput = document.getElementById("accessInput");
const gateErr = document.getElementById("gateErr");
document.getElementById("gateBtn").addEventListener("click", tryUnlock);
accessInput.addEventListener("keydown", e => { if (e.key === "Enter") tryUnlock(); });
accessInput.addEventListener("input", () => {
  accessInput.value = accessInput.value.replace(/\D/g, "").slice(0, 4);
  gateErr.classList.remove("show");
});
function tryUnlock() {
  const v = (accessInput.value || "").trim();
  if (v === ACCESS_CODE) {
    state.unlocked = true; gateErr.classList.remove("show");
    state.answers = []; state.qIndex = 0; renderQuestion(); show("screen-quiz");
  } else { gateErr.classList.add("show"); accessInput.focus(); }
}
function renderQuestion() {
  const q = QUESTIONS[state.qIndex];
  const total = QUESTIONS.length;
  document.getElementById("qNum").textContent = `${state.qIndex + 1} / ${total}`;
  document.getElementById("progressBar").style.width = `${(state.qIndex / total) * 100}%`;
  document.getElementById("qTitle").textContent = q.title;
  const box = document.getElementById("qOpts"); box.innerHTML = "";
  q.options.forEach(opt => {
    const b = document.createElement("button");
    b.type = "button"; b.className = "opt";
    b.innerHTML = `<span class="letter">${opt.letter}</span>${opt.text}`;
    b.addEventListener("click", () => pick(opt.code));
    box.appendChild(b);
  });
  document.getElementById("backBtn").style.display = state.qIndex > 0 ? "block" : "none";
}
function pick(code) {
  state.answers[state.qIndex] = code;
  if (state.qIndex < QUESTIONS.length - 1) { state.qIndex += 1; renderQuestion(); }
  else { document.getElementById("progressBar").style.width = "100%"; finish(); }
}
document.getElementById("backBtn").addEventListener("click", () => {
  if (state.qIndex > 0) { state.qIndex -= 1; renderQuestion(); }
});
function countCodes(answers) {
  const counts = {}; TIE_ORDER.forEach(c => { counts[c] = 0; });
  answers.forEach(c => { if (counts[c] != null) counts[c] += 1; });
  return counts;
}
function pickWinner(counts) {
  let max = -1; Object.values(counts).forEach(n => { if (n > max) max = n; });
  const tied = Object.keys(counts).filter(c => counts[c] === max);
  tied.sort((a, b) => TIE_ORDER.indexOf(a) - TIE_ORDER.indexOf(b));
  return tied[0];
}
function secondCount(counts, winner) {
  let second = 0;
  Object.keys(counts).forEach(c => { if (c !== winner && counts[c] > second) second = counts[c]; });
  return second;
}
function gapBonus(gap) { if (gap <= 0) return 0; if (gap === 1) return 2; if (gap === 2) return 4; return 5; }
function calcScore(winnerCount, gap) {
  let s = 68 + winnerCount * 3 + gapBonus(gap);
  if (s < 72) s = 72; if (s > 91) s = 91; return s;
}
function finish() {
  const counts = countCodes(state.answers);
  const winner = pickWinner(counts);
  const gap = counts[winner] - secondCount(counts, winner);
  const score = calcScore(counts[winner], gap);
  const persona = PERSONAS[winner];
  const others = Object.keys(counts).filter(c => c !== winner && counts[c] > 0)
    .sort((a, b) => (counts[b] - counts[a]) || (TIE_ORDER.indexOf(a) - TIE_ORDER.indexOf(b))).slice(0, 3);
  document.getElementById("resultName").textContent = persona.name;
  document.getElementById("resultTag").textContent = persona.tag;
  document.getElementById("phName").textContent = persona.name;
  const img = document.getElementById("resultImg");
  const ph = document.getElementById("resultPlaceholder");
  const loader = document.getElementById("resultLoader");
  const showLoader = () => { if (loader) loader.classList.add("show"); img.style.display = "none"; ph.style.display = "none"; };
  const showImg = () => { if (loader) loader.classList.remove("show"); img.style.display = "block"; ph.style.display = "none"; };
  const showPh = () => { if (loader) loader.classList.remove("show"); img.style.display = "none"; ph.style.display = "block"; };
  img.onload = showImg;
  img.onerror = showPh;
  showLoader();
  img.src = persona.img;
  if (img.complete && img.naturalWidth) showImg();
  document.getElementById("scoreNum").textContent = String(score);
  document.getElementById("resultStory").textContent = persona.story;
  document.getElementById("resultQuote").textContent = persona.quote;
  const ul = document.getElementById("resultPoints"); ul.innerHTML = "";
  persona.points.forEach(t => { const li = document.createElement("li"); li.textContent = t; ul.appendChild(li); });
  const alsoWrap = document.getElementById("alsoWrap");
  const chips = document.getElementById("alsoChips");
  if (others.length) {
    alsoWrap.style.display = "block"; chips.innerHTML = "";
    others.forEach(c => { const s = document.createElement("span"); s.textContent = PERSONAS[c].short; chips.appendChild(s); });
  } else alsoWrap.style.display = "none";
  window.__shareText = `我测到了「${persona.name}」· 脑补指数 ${score}/100\n${persona.quote}\n（测测你的暗恋剧本类型 · 仅供娱乐）`;
  show("screen-result");
}
document.getElementById("retryBtn").addEventListener("click", () => {
  state.answers = []; state.qIndex = 0; renderQuestion(); show("screen-quiz");
});
document.getElementById("shareHintBtn").addEventListener("click", async () => {
  const t = window.__shareText || "";
  try { await navigator.clipboard.writeText(t); alert("已复制晒文案～"); }
  catch (e) { prompt("复制下面文案：", t); }
});

function warmResultImages() {
  Object.values(PERSONAS).forEach(p => { const i = new Image(); i.src = p.img; });
}
warmResultImages();
</script>
